# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# for debugging help, https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

name: R-CMD-check-partitions

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Added tinytex to extra-packages so the R functions are available
          extra-packages: |
            any::rcmdcheck
            any::tinytex
          needs: check

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX dependencies
        run: |
          tinytex::tlmgr_install(c("bbm", "bbm-macros", "amsfonts", "doublestroke", "wasysym", "wrapfig", "wasy", "xypic"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--compact-vignettes=both")'
          args: 'c("--no-manual")'
          error-on: '"warning"'
        env:
          TINYTeX_AUTO_INSTALL: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-results
          path: check
